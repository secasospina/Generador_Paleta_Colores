<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Generador de paletas interactivo</title>
  </head>
  <body>
    <header>
      <h1>Generador de paletas interactivo</h1>
      <label for="colorCount">Seleccione la cantidad de colores:</label>
      <select id="colorCount">
        <option value="">Seleccione...</option>
        <option value="6">6 colores</option>
        <option value="8">8 colores</option>
        <option value="9">9 colores</option>
      </select>
      <label for="colorFormat">Elija el formato de color:</label>
      <select id="colorFormat">
        <option value="">Seleccione...</option>
        <option value="hsl">HSL</option>
        <option value="hex">HEXA</option>
      </select>
      <div class="action-buttons">
        <button id="generateButton">Generar paleta</button>
        <button id="clearButton">Limpiar paleta</button>
        <button id="savePaletteButton">Guardar paleta</button>
      </div>
    </header>

    <main>
      <div id="paletteContainer"></div>
    </main>

    <aside class="saved-palettes" aria-labelledby="savedPalettesTitle">
      <h2 id="savedPalettesTitle">Paletas guardadas</h2>
      <div id="savedPalettesContainer" class="saved-palettes-list"></div>
    </aside>

    <footer>
      <div class="footer-content">
        <p>Desarrollado por <span>Sebastián Castaño Ospina</span></p>
        <div class="social-links">
          <!-- Enlace GitHub -->
          <a
            href="https://github.com/secasospina"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
              ></path>
              <path d="M9 18c-4.51 2-5-2-7-2"></path>
            </svg>
          </a>
          <!-- Enlace LinkedIn -->
          <a
            href="https://www.linkedin.com/in/sebastiancastanoo/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
              ></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
          </a>
        </div>
      </div>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
